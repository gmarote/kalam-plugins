<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23E8590C'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='20' font-weight='bold' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<title>Hopper · Kalam</title>
<style>
  :root{
    --accent:#E8590C;--accent-soft:#FCEDE3;--teal:#0E7C86;--slate:#334155;
    --ink:#15191E;--muted:#6B7280;--faint:#9AA3AD;
    --bg:#FFFFFF;--panel:#FFFFFF;--soft:#F6F7F9;--line:#ECEEF1;
    --radius:16px;--shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.05);
    --ok:#15803D;--ok-soft:#E7F3EC;--warn:#B45309;--warn-soft:#FFFBEB;--err:#B91C1C;
  }
  *{box-sizing:border-box}
  body{font:14px/1.55 "DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);margin:0;background:var(--soft)}

  header.hero{background:linear-gradient(180deg,#FFFFFF 0%,#FBFBFC 100%);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;backdrop-filter:saturate(1.1) blur(6px)}
  .hero-in{max-width:1280px;margin:0 auto;padding:16px 28px;display:flex;align-items:center;gap:18px}
  .logo{display:flex;align-items:center;gap:12px;min-width:0}
  .logo-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent) 0%,#F08C3C 100%);box-shadow:0 4px 12px rgba(232,89,12,.30);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;flex:none}
  .logo-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
  .logo-name{font-weight:700;font-size:18px;letter-spacing:-.3px;line-height:1.2;color:var(--ink)}
  .logo-sub{font-size:12.5px;color:var(--muted);line-height:1.3}
  .hero-tag{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .tag{font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px;background:var(--soft);border:1px solid var(--line);color:var(--slate);white-space:nowrap}
  .tag.t{color:var(--teal);background:#E7F4F5;border-color:#cfe9eb}

  main{max-width:1280px;margin:0 auto;padding:26px 28px 60px}

  .dropzone{border:1.5px dashed #D1D5DB;border-radius:var(--radius);background:#FFFFFF;box-shadow:var(--shadow);cursor:pointer;transition:all .22s ease;position:relative;overflow:hidden;display:block;padding:52px 24px;text-align:center}
  .dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
  .dropzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
  .dz-ico{font-size:34px;display:block;margin-bottom:12px}
  .dz-title{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:5px}
  .dz-sub{font-size:13px;color:var(--muted)}
  .dz-pill{display:inline-block;margin-top:14px;font-size:12px;font-weight:600;color:var(--teal);background:#E7F4F5;border:1px solid #cfe9eb;padding:5px 12px;border-radius:20px}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin:16px 0}
  .toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:18px 0}
  button.primary{background:var(--accent);color:#fff;border:0;border-radius:11px;padding:11px 20px;font:700 14px inherit;cursor:pointer;box-shadow:0 4px 12px rgba(232,89,12,.25);transition:.15s}
  button.primary:hover{filter:brightness(1.05)} button.primary:disabled{opacity:.5;cursor:default;box-shadow:none}
  button.secondary{background:#fff;color:var(--accent);border:1.5px solid var(--accent);border-radius:11px;padding:9.5px 18px;font:700 14px inherit;cursor:pointer;transition:.15s}
  button.secondary:hover{background:var(--accent-soft)}
  .summary{font-size:13.5px;color:var(--slate)} .summary b{color:var(--ink)}

  .aviso{border:1px solid #f0d48a;background:var(--warn-soft);border-radius:12px;padding:10px 14px;margin:8px 0;font-size:13px}
  .aviso b{color:var(--warn)} .aviso ul{margin:5px 0 0;padding-left:18px}
  .ok{border:1px solid #bbe2c6;background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:13.5px;font-weight:600}

  details.panel summary{cursor:pointer;color:var(--accent);font-size:13.5px;font-weight:700;list-style:none}
  details.panel summary::-webkit-details-marker{display:none}
  details.panel summary::before{content:"▸ ";color:var(--faint)} details.panel[open] summary::before{content:"▾ "}

  .tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);max-height:480px;background:#fff;box-shadow:var(--shadow)}
  table{border-collapse:collapse;font-size:12px;white-space:nowrap;width:100%}
  th,td{border-bottom:1px solid var(--line);border-right:1px solid #f3f4f6;padding:6px 9px;text-align:left;vertical-align:top;max-width:320px;overflow:hidden;text-overflow:ellipsis}
  thead th{position:sticky;top:0;background:var(--soft);font-weight:700;color:var(--slate);z-index:1}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .dtab{white-space:normal} .dtab td,.dtab th{border-right:0}
  .muted{color:var(--muted)}.hide{display:none}
  .e-ok{color:var(--ok);font-weight:700}.e-warn{color:var(--warn);font-weight:700}.e-excl{color:var(--faint)}
  h2.sec{font-size:14px;color:var(--slate);margin:24px 0 6px;font-weight:700}
  .farchivo{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
  .farchivo:first-child{border-top:0}
  .farchivo .nom{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .farchivo .cnt{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .farchivo .dup{color:var(--warn);font-weight:600}
  .capwrap{border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);padding:12px 16px;max-height:360px;overflow:auto}
  .caprow{display:flex;align-items:center;gap:12px;padding:4px 0;font-size:12.5px}
  .capn{flex:0 0 230px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
  .capbar{flex:1;height:15px;background:var(--soft);border-radius:8px;overflow:hidden;min-width:90px}
  .capfill{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#F2935A);border-radius:8px;transition:width .5s ease}
  .capc{flex:0 0 60px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--slate)}
  .kpis{display:flex;gap:14px;flex-wrap:wrap;margin:4px 0 2px}
  .kpi{flex:1;min-width:140px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px}
  .kpi .n{font-size:27px;font-weight:800;letter-spacing:-.6px;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
  .kpi .l{font-size:12px;color:var(--muted);margin-top:5px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  .kpi .n{color:var(--ink)} .kpi.rev .n{color:#D9776F}   /* todo negro salvo "a revisar" en rojo pastel */
  .kpi,.capwrap{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  /* hero: tiempo de proceso */
  .hero-stat{display:flex;align-items:center;justify-content:space-between;gap:18px;background:linear-gradient(120deg,#FFF4EC 0%,#FFFFFF 62%);border:1px solid #F6D9C4;border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 22px;margin:4px 0 14px}
  .hs-l{display:flex;align-items:center;gap:14px}
  .hs-ic{font-size:28px;line-height:1}
  .hs-big{font-size:20px;font-weight:800;color:var(--ink);letter-spacing:-.4px}
  .hs-big .n{color:var(--accent)}
  .hs-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .hs-r{font-size:13px;color:var(--slate);font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  /* botón "ver ejemplo" */
  .ej-wrap{text-align:center;margin:12px 0 0}
  .btn-ej{background:none;border:0;color:var(--accent);font:600 13.5px inherit;cursor:pointer;padding:6px 12px;border-radius:8px}
  .btn-ej:hover{background:var(--accent-soft)}
  /* dashboard: anillo de integridad + donut por capítulo */
  .dash{display:flex;gap:18px;margin:2px 0 6px}
  .dcard{flex:1 1 0;min-width:0;min-height:178px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 28px;display:flex;align-items:center;gap:30px;animation:fade .35s ease}
  .dcard h3{margin:0 0 8px;font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
  .ring-n{font:800 26px "DM Sans",sans-serif;fill:var(--ink)}
  .d-sub{font-size:13.5px;color:var(--slate);line-height:1.5} .d-sub b{color:var(--ink);font-size:15px}
  .dc-text{flex:1;min-width:0}
  @media(max-width:720px){ .dash{flex-wrap:wrap} }
  .dc-chart{flex:none}
  .donut-leg{font-size:12px;color:var(--slate);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px;row-gap:6px;min-width:0}
  .donut-leg .li{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden}
  .donut-leg .li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .donut-leg .li .v{margin-left:auto;padding-left:8px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--slate)}
  .donut-leg .sw{width:11px;height:11px;border-radius:3px;flex:none}
  footer.pie{border-top:1px solid var(--line);background:var(--soft)}
  .pie-in{max-width:1280px;margin:0 auto;padding:18px 28px;text-align:right;font-size:13px;color:var(--faint)}
  .pie-name{font-weight:600;color:var(--muted)}
  .pie-in a{color:var(--faint);text-decoration:none} .pie-in a:hover{color:var(--accent)}
  #status{margin:14px 0;font-size:13.5px;color:var(--slate);font-weight:600}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-in">
    <div class="logo">
      <div class="logo-mark">K</div>
      <div class="logo-txt">
        <span class="logo-name">Kalam</span>
        <span class="logo-sub">Hopper · Aplicación para la normalización de mediciones</span>
      </div>
    </div>
  </div>
</header>
<main>
  <label class="dropzone" id="drop">
    <input type="file" id="file" accept=".xlsx,.xls" multiple>
    <span class="dz-ico">📐</span>
    <div class="dz-title">Arrastra aquí tus ficheros de mediciones</div>
    <div class="dz-sub">o haz clic para seleccionarlos · puedes cargar uno o varios, se combinan en una sola tabla · admite <b>.xlsx</b> y <b>.xls</b></div>
    <span class="dz-pill">🔒 Tus datos no salen de tu ordenador: el procesamiento es local</span>
  </label>
  <div class="ej-wrap"><button class="btn-ej" id="verEjemplo">▶ Ver un ejemplo (sin subir nada)</button></div>

  <div id="status" class="hide"></div>
  <div id="kpis"></div>
  <div id="dash" class="dash"></div>

  <div class="panel hide" id="archivosWrap">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px">
      <b id="archivosSum" style="font-size:13.5px;color:var(--slate)">Archivos cargados</b>
      <button id="reset" style="background:none;border:1px solid var(--line);border-radius:8px;padding:5px 12px;font:600 12px inherit;color:var(--muted);cursor:pointer">Empezar de nuevo</button>
    </div>
    <div id="archivos"></div>
  </div>

  <details class="panel hide" id="avisosWrap"><summary id="avisosSum">Avisos</summary><div id="avisos" style="margin-top:10px"></div></details>
  <details class="panel hide" id="detalleWrap"><summary id="detalleSum">Detalle por hoja</summary><div id="detalle" style="margin-top:10px"></div></details>

  <div class="toolbar hide" id="toolbar">
    <button class="primary" id="dl">⬇ Descargar Excel normalizado</button>
    <button class="secondary" id="dlcost" title="Estructura + cantidad, lista para pegar en el sistema de costes de Kalam">⬇ Descargar hoja de costes</button>
    <span class="summary" id="summary"></span>
  </div>
  <div id="preview"></div>
  <div id="resumen"></div>
</main>
<footer class="pie">
  <div class="pie-in"><span class="pie-name">Gerardo Marote</span> · <a href="https://visualmetrics.net" target="_blank" rel="noopener">visualmetrics.net</a></div>
</footer>

/* Motor de normalización de MQT — Capa 1 (sin IA).

  "use strict";

  var CANON = ["archivo","hoja","fila_origen","capitulo","subcapitulo","seccion",

               "precio_unitario","importe"];

  // Excel 2 «hoja de costes»: estructura + cantidad para volcar al sistema de costes.

    var n = Number(s);

  function isCaps(s){ var letters=s.replace(/[^A-Za-zÀ-ÿ]/g,""); return letters.length>2 && s===s.toUpperCase(); }
  var STRUCT=/^[A-Za-z]{0,4}\d*(\.[A-Za-z0-9]+)*$/;
  function isStructCode(s){ return STRUCT.test(s) && /\d/.test(s) && s.toUpperCase().indexOf("CG")!==0; }
  function isLetterChapter(s){ return /^[A-Za-z]{1,4}$/.test(s); }

  function rec(o){
    var r={}; CANON.forEach(function(c){ r[c]=""; });
    Object.keys(o).forEach(function(k){ r[k]=o[k]; });

  // rejilla de la hoja alineada a A1: grid[i] == fila (i+1) real de Excel, col 0 == A.

  }

  // ---- localizar cabecera por contenido aproximado ----
  function findHeader(grid, col, markers){
    for(var i=0;i<grid.length;i++){
      var c = txt(cell(grid[i],col)).toLowerCase().replace(/\n/g," ");
      for(var m=0;m<markers.length;m++) if(c.indexOf(markers[m])>=0) return i;

  // ---- auto-detección de mapeo de columnas y familia (capa 1 sin IA) ----
  var ROLE_MARKERS = {
    code: ["item","art","códig","codig","nº","n.º"],
    desc: ["design","descri","trabalho","articulado"],
    unit: ["un.","unid","und"," un","unit"],   // "unit" también; se desempata abajo
    qty:  ["quant","qtd","qte","medi","totais","total"],
    price:["preç","prec","custo","valor"]
  };
  function roleOf(label){
    var s=label.toLowerCase().replace(/\n/g," ").trim();
    if(!s) return null;
    // orden importa: precio/€ antes que "total" (un "Total €" es importe, no cantidad)
    if(/preç|prec|custo|€|valor/.test(s)) return "price";
    if(/design|descri|trabalho|articulado/.test(s)) return "desc";
    if(/quant|qtd|qte|medi/.test(s)) return "qty";   // cantidad: NO "total" a secas (ambiguo)

  var UNID=/^(m|m2|m3|m²|m³|ml|cm|mm|km|kg|kgs|ton|t|un|u|und|uni|unid|vg|cj|conj|pç|pc|pcs|lote|h|hr|hrs|dia|dias|mes|mês|gl|l|lt|saco|saca|fg|ud|uds|par)\.?$/i;

  function ncols(grid){ var n=0; for(var i=0;i<grid.length;i++) if(grid[i]&&grid[i].length>n) n=grid[i].length; return n; }

  // estimación INDEPENDIENTE del mapeo: nº de filas del original que "parecen" una
  // medición (tienen un número > 0 y una unidad real en algún sitio). Sirve para
  // reconciliar: si emitimos muchas menos partidas que esto, hemos perdido datos.

      var rw=grid[r]; if(!rw) continue; var hasNum=false, hasUnit=false;

  // mapeo por etiquetas de cabecera (respaldo cuando el contenido no decide)

  }

    function esQtyLbl(s){ return /\bqt\b|qtd|qte|quant|medi[cç]/.test(s); }                                  // cantidad (NO "total" a secas)

    var used={}, cols={}, lab=labelCols(grid, headerRow);
    function pick(role, scoreFn){
      var bi=-1,bv=0; for(var a=0;a<N;a++){ if(used[a]) continue; var v=scoreFn(met[a],a); if(v>bv){bv=v;bi=a;} }
      if(bi>=0){ cols[role]=bi; used[bi]=1; }
    }
    pick("code", function(m){ return m.esCodigo ? m.nCodes : 0; });            // jerarquía real
    pick("desc", function(m){ return m.textN ? m.textLen/m.textN : 0; });      // texto más largo
    pick("unit", function(m){ return m.unit; });                               // tokens de unidad
    pick("qty",  function(m,a){                                                // cantidad: QUANT/QT, NUNCA dimensiones/precio
      if(esDim(lbl[a]) || esPriceLbl(lbl[a])) return 0;
      return m.numNZ + (esQtyLbl(lbl[a]) ? 1e7 : 0);
    });
    pick("price",function(m,a){ return m.num + (esPriceLbl(lbl[a]) ? 1e7 : 0); });
    ["code","desc","unit","qty","price"].forEach(function(role,idx){
      if(cols[role]==null) cols[role] = (lab[role]!=null && !used[lab[role]] ? lab[role] : idx);
    });

    var familia = (cols.code!=null && met[cols.code] && met[cols.code].esCodigo) ? "codigo" : "formato";
    return { headerRow:headerRow, cols:cols, familia:familia, headerScore:bestScore };
  }

  // ---- familia CÓDIGO ----
  function parseCodigo(grid, cols, archivo, hoja, headerRow, stats, est){
    var out=[], titles={}, cur=null, curEst=null, start = headerRow>=0 ? headerRow+1 : 0;
    function pushEst(o){ if(est) est.push(o); curEst=o; return o; }
    for(var i=start;i<grid.length;i++){
      var row=grid[i], fila=i+1;
      var code=txt(cell(row,cols.code)), desc=txt(cell(row,cols.desc)), unit=txt(cell(row,cols.unit));
      if(unit==="0") unit="";
      var qty=toNum(cell(row,cols.qty)), price=toNum(cell(row,cols.price));
      if(!code && !desc && qty===null){ stats.vacia++; continue; }
      if(/^(sub\s*total|total)\b/i.test(desc) && qty===null){ stats.subtotal++; continue; }
      if(isLetterChapter(code) && qty===null){ stats.titulo++; titles={1:desc}; cur={code:code,desc:desc,nivel:1};
        pushEst({codigo:code,nat:"Capitulo",ud:"",partida:desc,cantidad:""}); continue; }
      if(!isStructCode(code)){
        if(qty!==null && unit){                       // medición sin código en su fila
          stats.partida++;
          if(cur){                                    // partida compuesta: hereda código y partida de arriba
            out.push(rec({archivo:archivo,hoja:hoja,fila_origen:fila,
              capitulo:(cur.nivel>1?(titles[1]||""):""),
              subcapitulo:(cur.nivel>2?(titles[2]||""):""),
              seccion:(cur.nivel>3?(titles[3]||""):""),
              ruta:rutaDe(titles,cur.nivel),codigo:cur.code,partida:cur.desc,detalle:desc,
              unidad:unit,medicion:qty,precio_unitario:(price===null?"":price)}));
            if(curEst && curEst.codigo===cur.code && curEst.nat!=="Capitulo"){   // la cabecera era una partida compuesta
              if(curEst.nat!=="Partida"){ curEst.nat="Partida"; curEst.ud=unit; }
              curEst.cantidad=(Number(curEst.cantidad)||0)+qty;                  // suma de sus parciais
            } else pushEst({codigo:cur.code,nat:"Partida",ud:unit,partida:cur.desc,cantidad:qty});
          } else {                                    // sin partida previa: se emite igual sin código
            out.push(rec({archivo:archivo,hoja:hoja,fila_origen:fila,
              capitulo:titles[1]||"",subcapitulo:titles[2]||"",seccion:titles[3]||"",
              ruta:rutaDe(titles,99),codigo:"",partida:desc,
              unidad:unit,medicion:qty,precio_unitario:(price===null?"":price)}));
            pushEst({codigo:"",nat:"Partida",ud:unit,partida:desc,cantidad:qty});
          }
        } else { (desc?stats.nota++:stats.vacia++); if(desc) out.push(["__nota__",hoja,fila,desc]); }
        continue;
      }
      var nivel = code.split(".").length;
      if(qty!==null && unit){
        stats.partida++;
        out.push(rec({archivo:archivo,hoja:hoja,fila_origen:fila,
          capitulo:(nivel>1?(titles[1]||""):""),
          subcapitulo:(nivel>2?(titles[2]||""):""),
          seccion:(nivel>3?(titles[3]||""):""),
          ruta:rutaDe(titles,nivel),codigo:code,partida:desc,unidad:unit,medicion:qty,
          precio_unitario:(price===null?"":price)}));
        cur={code:code,desc:desc,nivel:nivel};
        pushEst({codigo:code,nat:"Partida",ud:unit,partida:desc,cantidad:qty});
      } else {
        stats.titulo++; titles[nivel]=desc;
        Object.keys(titles).forEach(function(k){ if(+k>nivel) delete titles[k]; });
        cur={code:code,desc:desc,nivel:nivel};
        pushEst({codigo:code,nat:(nivel===1?"Capitulo":nivel===2?"Subcapitulo":"Sección"),ud:"",partida:desc,cantidad:""});
      }
    }
    return out;
  }
  function rutaDe(titles, nivel){
    return Object.keys(titles).map(Number).filter(function(k){return k<nivel && titles[k];})
           .sort(function(a,b){return a-b;}).map(function(k){return titles[k];}).join(" > ");
  }

  // ---- familia FORMATO ----
  function parseFormato(grid, cols, archivo, hoja, headerRow, capituloHoja, stats, est){
    var capitulo = capituloHoja, out=[], subcap="", partida=null, curEst=null;
    function pushEst(o){ if(est) est.push(o); curEst=o; return o; }
    if(headerRow>=0){ var d=txt(cell(grid[headerRow],cols.desc)); capitulo=d||capituloHoja; }
    pushEst({codigo:"",nat:"Capitulo",ud:"",partida:capitulo,cantidad:""});
    var start = headerRow>=0?headerRow+1:0;
    for(var i=start;i<grid.length;i++){
      var row=grid[i], fila=i+1;
      var code=txt(cell(row,cols.code)), desc=txt(cell(row,cols.desc)), unit=txt(cell(row,cols.unit));
      if(unit==="0") unit="";
      var qty=toNum(cell(row,cols.qty)), price=toNum(cell(row,cols.price));
      if(desc==="DESCRITIVO") continue;
      if(!code && !desc && qty===null){ stats.vacia++; continue; }
      if(/^total\b/i.test(desc) && qty===null){ stats.subtotal++; continue; }
      var ruta=[capitulo,subcap].filter(Boolean).join(" > ");
      if(code){
        if(isCaps(desc) && qty===null){ subcap=desc; partida=null; stats.titulo++;
          pushEst({codigo:code,nat:"Subcapitulo",ud:"",partida:desc,cantidad:""}); continue; }
        partida={code:code,desc:desc}; stats.partida++;
        if(qty!==null) out.push(rec({archivo:archivo,hoja:hoja,fila_origen:fila,
          capitulo:capitulo,subcapitulo:subcap,ruta:ruta,codigo:code,partida:desc,
          unidad:unit,medicion:qty,precio_unitario:(price===null?"":price)}));
        pushEst({codigo:code,nat:"Partida",ud:unit,partida:desc,cantidad:(qty!==null?qty:"")});
        continue;
      }
      if(qty!==null){
        stats.parcial++; var base=partida||{code:"",desc:""};
        out.push(rec({archivo:archivo,hoja:hoja,fila_origen:fila,capitulo:capitulo,
          subcapitulo:subcap,ruta:ruta,codigo:base.code,partida:base.desc,detalle:desc,
          unidad:unit,medicion:qty,precio_unitario:(price===null?"":price)}));
        if(curEst && curEst.nat==="Partida"){                  // parcial -> suma a su partida
          if(curEst.cantidad===""||curEst.cantidad==null) curEst.cantidad=qty;
          else curEst.cantidad=(Number(curEst.cantidad)||0)+qty;
          if(!curEst.ud) curEst.ud=unit;
        } else pushEst({codigo:base.code,nat:"Partida",ud:unit,partida:base.desc,cantidad:qty});
      } else if(desc){ stats.nota++; out.push(["__nota__",hoja,fila,desc]); }
    }
    return out;
  }

  function nuevoStats(){ return {titulo:0,partida:0,parcial:0,nota:0,subtotal:0,vacia:0}; }

  // ---- autoevaluación: avisos que EXPLICAN qué pasó y qué hacer (sin jerga) ----
  function unidadSospechosa(u){ u=String(u).trim(); return u.length>6 || (u!=="" && /^[\d.,]+$/.test(u)); }
  function colLetra(j){
    j=Number(j); if(isNaN(j)||j<0) return "?";
    var s=""; j++; while(j>0){ var m=(j-1)%26; s=String.fromCharCode(65+m)+s; j=Math.floor((j-1)/26); }
    return s;
  }
  function avisosDe(inf, medRows){
    var a=[], c=inf.cols||{}, np=medRows.length, est=inf.estMedidas||0;
    var cols="descripción "+colLetra(c.desc)+" · unidad "+colLetra(c.unit)+" · cantidad "+colLetra(c.qty);

    if(np===0){
      if(est>=5) a.push("El original aparenta ~"+est+" mediciones pero no se extrajo ninguna: el mapeo de columnas no cuadra (asumí "+cols+"). Revísalo.");
      else a.push("Sin partidas extraídas y apenas "+est+" fila"+(est===1?"":"s")+" con pinta de medición: probablemente no es una hoja de medición. Si esperabas datos, revisa las columnas.");
      return a;  // sin partidas, el resto de avisos no aporta
    }

    // 1) Reconciliación: ¿hemos perdido mediciones respecto al original?
    if(est>=5 && np < est*0.7)
      a.push("Posible pérdida: el original aparenta ~"+est+" mediciones y solo se extrajeron "+np+". Revisa el mapeo (sobre todo la columna de cantidad).");
    // 2) Mapeo poco seguro: solo si además quedó incompleto (en extracciones completas no molesta)
    else if((inf.headerRow<0 || inf.headerScore<3) && est>0 && np<est)
      a.push("Mapeo poco seguro (cabecera "+(inf.headerRow<0?"no localizada":"poco clara")+"); asumí "+cols+". Si las partidas no cuadran, ajusta las columnas.");

    // 3) Unidades raras (proporcional: solo concluye si afecta a muchas filas)
    var us={}, nU=0; medRows.forEach(function(r){ var u=String(r.unidad||"").trim(); if(u&&unidadSospechosa(u)){us[u]=1;nU++;} });
    var ul=Object.keys(us);
    if(ul.length){
      if(nU>=np*0.5) a.push(nU+" de "+np+" partidas con unidad rara ("+ul.slice(0,5).join(", ")+") — puede que la columna "+colLetra(c.unit)+" no sea la de unidades.");
      else a.push("Unidades poco habituales en "+nU+" fila"+(nU>1?"s":"")+" ("+ul.slice(0,5).join(", ")+"); compruébalas si te chocan.");
    }

    // 4) Cantidad 0 (proporcional)
    var z=medRows.filter(function(r){return r.medicion===0;}).length;
    if(z>0){
      if(z>=np*0.5) a.push(z+" de "+np+" partidas con cantidad 0 — puede que la columna "+colLetra(c.qty)+" no sea la de cantidad.");
      else a.push(z+" partida"+(z>1?"s":"")+" con cantidad 0 (probablemente sin medir todavía).");
    }
    return a;
  }

  // ---- huella de ítems de una hoja, para detectar duplicados entre hojas ----
  function clavesDe(medRows){
    var s={};
    medRows.forEach(function(r){
      var k=((r.codigo||"")+"¶"+(r.partida||"")).toLowerCase().replace(/\s+/g," ").trim();
      if(k!=="¶") s[k]=1;
    });
    return s;
  }
  function contencion(a,b){            // fracción de claves de A presentes en B
    var ka=Object.keys(a); if(!ka.length) return 0;
    var n=0; for(var i=0;i<ka.length;i++) if(b[ka[i]]) n++;
    return n/ka.length;
  }

  // ---- API principal: normaliza un workbook (de XLSX.read) ----
  // Procesa TODAS las hojas (no se descarta nada por nombre) y descarta solo las
  // que resulten ser duplicado/subconjunto de otra hoja mayor (evita doble conteo).
  function normalizar(wb, archivo, XLSX, overrides){
    overrides = overrides||{};
    var info={}, data={}, nombres=wb.SheetNames;

    // 1) parsear todas las hojas
    nombres.forEach(function(hoja){
      var grid=gridDe(wb.Sheets[hoja], XLSX);
      var det=autoDetect(grid), ov=overrides[hoja]||{};
      var familia=ov.familia||det.familia;
      var headerRow=ov.headerRow!=null?ov.headerRow:det.headerRow;
      var cols=ov.cols||det.cols;
      info[hoja]={familia:familia,headerRow:headerRow,cols:cols,headerScore:det.headerScore,
                  filas:grid.length,excluida:false,motivo:"",
                  estMedidas:estimaMedidas(grid, headerRow>=0?headerRow+1:0)};
      var stats=nuevoStats(), res, medRows=[], notasRows=[], estRows=[];
      if(familia==="codigo") res=parseCodigo(grid,cols,archivo,hoja,headerRow,stats,estRows);
      else res=parseFormato(grid,cols,archivo,hoja,headerRow,hoja,stats,estRows);
      res.forEach(function(r){ if(Array.isArray(r)) notasRows.push({hoja:r[1],fila_origen:r[2],nota:r[3]}); else medRows.push(r); });
      info[hoja].stats=stats;
      info[hoja].nMed=medRows.length;        // partidas emitidas (lo que va a la salida)
      data[hoja]={medRows:medRows,notas:notasRows,claves:clavesDe(medRows),est:estRows};
    });

    // 2) detectar duplicados: una hoja sobra si está contenida (>=80%) en otra mayor
    nombres.forEach(function(A){
      var ka=data[A].claves, na=Object.keys(ka).length;
      if(na===0) return;
      for(var j=0;j<nombres.length;j++){
        var B=nombres[j]; if(B===A) continue;
        var nb=Object.keys(data[B].claves).length;
        var mayor = nb>na || (nb===na && j<nombres.indexOf(A));
        var c=contencion(ka, data[B].claves);
        if(mayor && c>=0.8){
          info[A].excluida=true;
          info[A].motivo="duplicada de «"+B+"» ("+Math.round(100*c)+"% de sus ítems ya están en "+B+")";
          break;
        }
      }
    });

    // 3) SEGUNDA CAPA: descartar hojas que objetivamente no tienen mediciones.
    //    Criterio (sin humano): 0 partidas extraídas Y el estimador independiente
    //    apenas ve filas con cantidad+unidad -> no es hoja de medición (resumen,
    //    índice, portada, notas). Si el estimador SÍ ve mediciones (est>=5), NO se
    //    descarta: es señal de pérdida y se mantiene marcada (lo gestiona avisosDe).
    nombres.forEach(function(h){
      var i=info[h]; if(i.excluida) return;
      // (a) ni una fila con cantidad+unidad real
      if(i.nMed===0 && i.estMedidas===0){
        i.excluida=true; i.noFuente=true; i.motivo="no es hoja de medición (ninguna fila con cantidad + unidad)"; return;
      }
      // (b) extrajo "partidas" pero el estimador no ve nada Y casi todo es cantidad 0
      //     -> resumen/subtotales mal interpretados (p. ej. listado de capítulos)
      if(i.estMedidas===0 && i.nMed>0){
        var ms=data[h].medRows, z=0; for(var k=0;k<ms.length;k++){ if(ms[k].medicion===0||ms[k].medicion===""||ms[k].medicion==null) z++; }
        if(z/ms.length>=0.9){ i.excluida=true; i.noFuente=true; i.motivo="no es hoja de medición (subtotales a 0, sin unidades reales)"; }
      }
    });

    // 4) salida desde las hojas no descartadas + avisos
    var medic=[], notas=[], estruct=[];
    nombres.forEach(function(h){
      var i=info[h];
      if(i.excluida){ i.avisos=[i.motivo]; return; }
      medic=medic.concat(data[h].medRows);
      notas=notas.concat(data[h].notas);
      estruct=estruct.concat(data[h].est);
      i.avisos=avisosDe(i, data[h].medRows);
    });
    return { mediciones:medic, notas:notas, estructura:estruct, info:info, CANON:CANON, COSTHEAD:COSTHEAD };
  }

  // ---- acumular varios ficheros en una sola salida (dedup a nivel de fichero) ----
  // items: [{archivo, det}]  (det = resultado de normalizar). Un fichero se descarta
  // si sus ítems están contenidos (>=80%) en otro mayor (p. ej. cargar dos veces el
  // mismo). Especialidades distintas (Ferragial ARQ vs ESP) NO se solapan -> se suman.
  function acumular(items){
    var claves=items.map(function(it){ return clavesDe(it.det.mediciones); });
    var n=claves.map(function(k){ return Object.keys(k).length; });
    var archivos=items.map(function(it){ return {nombre:it.archivo, nMed:it.det.mediciones.length, excluido:false, motivo:""}; });
    for(var a=0;a<items.length;a++){
      if(n[a]===0) continue;
      for(var b=0;b<items.length;b++){
        if(b===a) continue;
        var mayor = n[b]>n[a] || (n[b]===n[a] && b<a);
        var c=contencion(claves[a], claves[b]);
        if(mayor && c>=0.8){ archivos[a].excluido=true; archivos[a].motivo="duplicado de «"+items[b].archivo+"» ("+Math.round(100*c)+"%)"; break; }
      }
    }
    var usados=archivos.filter(function(a){return !a.excluido;}).length;
    var medic=[], notas=[], hojas=[], estruct=[];
    items.forEach(function(it,i){
      if(archivos[i].excluido) return;
      medic=medic.concat(it.det.mediciones);
      notas=notas.concat(it.det.notas);
      if(it.det.estructura && it.det.estructura.length){
        if(usados>1) estruct.push({codigo:"",nat:"__archivo__",ud:"",partida:it.archivo,cantidad:""});
        estruct=estruct.concat(it.det.estructura);
      }
      Object.keys(it.det.info).forEach(function(h){
        var inf=it.det.info[h];
        hojas.push({archivo:it.archivo,hoja:h,nMed:inf.nMed||0,excluida:inf.excluida,
                    noFuente:!!inf.noFuente,motivo:inf.motivo,avisos:inf.avisos||[]});
      });
    });
    return { mediciones:medic, notas:notas, estructura:estruct, archivos:archivos, hojas:hojas, CANON:CANON, COSTHEAD:COSTHEAD };
  }

  var API={CANON:CANON,COSTHEAD:COSTHEAD,txt:txt,toNum:toNum,isStructCode:isStructCode,autoDetect:autoDetect,
           parseCodigo:parseCodigo,parseFormato:parseFormato,normalizar:normalizar,
           clavesDe:clavesDe,contencion:contencion,acumular:acumular};
  if(typeof module!=="undefined"&&module.exports) module.exports=API;
  else root.HopperCore=API;
})(typeof window!=="undefined"?window:this);

<script>
/* ---- UI: acumula varios ficheros en una sola tabla. Auto + avisos.
   Dentro de cada fichero se deduplica por hojas; entre ficheros, por fichero. ---- */
(function(){
  var XLSX = window.XLSX, core = window.HopperCore;
  var cargados = [];   // [{archivo, det}]
  var merged = null;
  var ultimoMs = 0;    // tiempo del último procesado (para el cronómetro)
  var $=function(id){return document.getElementById(id);};
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  var drop=$("drop"), file=$("file");
  ["dragenter","dragover"].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.add("over");});});
  ["dragleave","drop"].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.remove("over");});});
  drop.addEventListener("drop",function(ev){ if(ev.dataTransfer.files.length) cargarVarios(ev.dataTransfer.files); });
  file.addEventListener("change",function(){ if(file.files.length) cargarVarios(file.files); file.value=""; });
  $("reset").addEventListener("click",function(){ cargados=[]; merged=null; ultimoMs=0; procesando(false); recalcular(); });
  if($("verEjemplo")) $("verEjemplo").addEventListener("click",cargarEjemplo);

  function procesando(on, txt){ var s=$("status"); s.classList.toggle("hide",!on); s.innerHTML = on ? ('<span class="spin"></span>'+esc(txt||"Procesando…")) : ""; }

  function cargarVarios(fileList){
    var arr=Array.prototype.slice.call(fileList), pend=arr.length, t0=performance.now();
    procesando(true, "Procesando "+arr.length+" archivo"+(arr.length>1?"s":"")+"…");
    arr.forEach(function(f){
      var rd=new FileReader();
      rd.onload=function(){
        try{ var wb=XLSX.read(new Uint8Array(rd.result),{type:"array"});
          cargados.push({archivo:f.name, det:core.normalizar(wb, f.name, XLSX, {})}); }catch(e){}
        if(--pend===0){ ultimoMs=performance.now()-t0; setTimeout(function(){ recalcular(); procesando(false); }, 20); }  // deja pintar el spinner
      };
      rd.readAsArrayBuffer(f);
    });
  }

  // "Ver ejemplo": MQT real incrustado en el propio HTML. Un clic, sin subir nada.
  function cargarEjemplo(){
    if(!window.EJEMPLO_B64) return;
    procesando(true, "Procesando ejemplo…");
    setTimeout(function(){
      var t0=performance.now();
      try{
        var bin=atob(window.EJEMPLO_B64), len=bin.length, u8=new Uint8Array(len);
        for(var i=0;i<len;i++) u8[i]=bin.charCodeAt(i);
        var wb=XLSX.read(u8,{type:"array"}), nom=window.EJEMPLO_NOMBRE||"ejemplo.xlsx";
        cargados.push({archivo:nom, det:core.normalizar(wb, nom, XLSX, {})});
      }catch(e){}
      ultimoMs=performance.now()-t0;
      recalcular(); procesando(false);
    }, 20);
  }

  function recalcular(){
    merged = cargados.length ? core.acumular(cargados) : null;
    render();
  }

  function render(){
    if(!merged){
      $("archivosWrap").classList.add("hide"); $("toolbar").classList.add("hide");
      $("avisosWrap").classList.add("hide"); $("detalleWrap").classList.add("hide");
      $("preview").innerHTML=""; $("resumen").innerHTML=""; $("kpis").innerHTML=""; $("dash").innerHTML=""; return;
    }
    var m=merged.mediciones;

    // archivos cargados
    $("archivosWrap").classList.remove("hide");
    $("archivosSum").textContent = "Archivos cargados · "+merged.archivos.length;
    $("archivos").innerHTML = merged.archivos.map(function(a){
      return '<div class="farchivo"><span class="nom">'+(a.excluido?"♻ ":"📄 ")+esc(a.nombre)+'</span>'+
        (a.excluido?'<span class="cnt dup">'+esc(a.motivo)+'</span>':'<span class="cnt">'+a.nMed+' partidas</span>')+'</div>';
    }).join("");

    // toolbar + resumen
    $("toolbar").classList.toggle("hide", m.length===0);
    var usados=merged.archivos.filter(function(a){return !a.excluido;}).length;
    var dupF=merged.archivos.length-usados;
    $("summary").textContent = m.length+" mediciones · "+merged.notas.length+" notas · "+
      usados+" archivo"+(usados!==1?"s":"")+(dupF?(" · "+dupF+" duplicado"+(dupF>1?"s":"")):"");

    // tarjetas KPI (orden jerárquico: archivo › capítulo › partida › a revisar)
    var capset={}; m.forEach(function(r){ capset[(r.capitulo&&String(r.capitulo).trim())||"—"]=1; });
    var nCap=Object.keys(capset).length;
    var aRev=merged.hojas.filter(function(h){return !h.excluida && h.avisos.length;}).length;
    function kpi(n,sing,plu,cls){ return '<div class="kpi'+(cls?" "+cls:"")+'"><div class="n" data-to="'+n+'">0</div><div class="l">'+(n===1?sing:plu)+'</div></div>'; }
    var hero = (ultimoMs>0) ? ('<div class="hero-stat"><div class="hs-l"><span class="hs-ic">⚡</span><div>'+
        '<div class="hs-big">Normalizado en <span class="n" data-to="'+(ultimoMs/1000)+'" data-dec="1">0,0</span> s</div>'+
        '<div class="hs-sub">frente a días de trabajo manual</div></div></div>'+
        '<div class="hs-r"><span class="n" data-to="'+m.length+'">0</span> mediciones<br>en '+merged.hojas.filter(function(h){return !h.excluida;}).length+' hojas</div></div>') : "";
    $("kpis").innerHTML = m.length ? (hero+'<div class="kpis">'+
      kpi(usados,"archivo","archivos")+
      kpi(nCap,"capítulo","capítulos")+
      kpi(m.length,"partida","partidas")+
      kpi(aRev,"hoja a revisar","hojas a revisar",aRev>0?"rev":"")+'</div>') : "";
    animarContadores($("kpis"));
    pintarDashboard(m, merged);

    // avisos (plegable): SOLO lo accionable. Las hojas no-fuente (resúmenes/índices)
    // se descartan en una 2ª capa y se resumen en una línea, no aturullan.
    var av="", n=0, noFuente=merged.hojas.filter(function(h){return h.excluida && h.noFuente;}).length;
    merged.archivos.forEach(function(a){ if(a.excluido){ av+='<div class="aviso"><b>♻ '+esc(a.nombre)+' — archivo descartado (duplicado)</b><ul><li>'+esc(a.motivo)+'</li></ul></div>'; n++; } });
    merged.hojas.forEach(function(h){
      if(h.excluida && !h.noFuente){ av+='<div class="aviso"><b>♻ '+esc(h.archivo)+' › '+esc(h.hoja)+' — hoja duplicada</b><ul><li>'+esc(h.motivo)+'</li></ul></div>'; n++; }
      else if(!h.excluida && h.avisos.length){ av+='<div class="aviso"><b>⚠ '+esc(h.archivo)+' › '+esc(h.hoja)+'</b><ul>'+h.avisos.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+'</ul></div>'; n++; }
    });
    if(noFuente) av+='<div class="aviso" style="border-color:var(--line);background:var(--soft)"><b>🚫 '+noFuente+' hoja'+(noFuente>1?"s":"")+' descartada'+(noFuente>1?"s":"")+'</b> por no contener mediciones (resúmenes, índices, portadas…). Ver «Detalle por hoja».</div>';
    $("avisosWrap").classList.toggle("hide", m.length===0);
    $("avisosWrap").open = n>0;
    $("avisosSum").textContent = n ? ("Avisos · "+n+" a revisar") : "Avisos · todo correcto ✓";
    $("avisos").innerHTML = (n||noFuente) ? av : '<div class="ok">✓ Detección limpia y sin duplicados.</div>';

    // detalle por hoja (plegable): archivo · hoja · estado · partidas
    $("detalleWrap").classList.toggle("hide", merged.hojas.length===0);
    $("detalleSum").textContent = "Detalle por hoja · "+merged.hojas.length;
    var rows=merged.hojas.map(function(h){
      var estado = (h.excluida && h.noFuente) ? '<span class="e-excl" title="'+esc(h.motivo||"")+'">no-fuente</span>'
                 : h.excluida ? '<span class="e-excl" title="'+esc(h.motivo||"")+'">duplicada</span>'
                 : (h.avisos.length) ? '<span class="e-warn">revisar</span>' : '<span class="e-ok">ok</span>';
      return "<tr><td>"+esc(h.archivo)+"</td><td>"+esc(h.hoja)+"</td><td>"+estado+"</td><td class='num'>"+h.nMed+"</td></tr>";
    }).join("");
    $("detalle").innerHTML='<table class="dtab"><thead><tr><th>archivo</th><th>hoja</th><th>estado</th><th>partidas</th></tr></thead><tbody>'+rows+'</tbody></table>';

    // preview
    var NUM={medicion:1,precio_unitario:1,importe:1};
    var head="<thead><tr>"+merged.CANON.map(function(c){return "<th>"+c+"</th>";}).join("")+"</tr></thead>";
    var body=m.slice(0,200).map(function(r){
      return "<tr>"+merged.CANON.map(function(c){
        var v=r[c], num=NUM[c]&&v!==""&&v!=null;
        var disp=num?Number(v).toLocaleString("pt-PT",{minimumFractionDigits:2,maximumFractionDigits:(c==="medicion"?4:2)}):esc(v==null?"":v);
        return '<td'+(num?' class="num"':'')+'>'+disp+'</td>';
      }).join("")+"</tr>";
    }).join("");
    $("preview").innerHTML = m.length? ('<div class="tbl-wrap"><table>'+head+"<tbody>"+body+"</tbody></table></div>"+
      (m.length>200?'<p class="muted" style="font-size:12px">Mostrando 200 de '+m.length+' filas. El Excel descargado las trae todas.</p>':'')) : "";

    // resumen por capítulo (tabla + barras)
    var porCap={}; m.forEach(function(r){ var k=(r.capitulo&&String(r.capitulo).trim())||"(sin capítulo)"; porCap[k]=(porCap[k]||0)+1; });
    var caps=Object.keys(porCap).map(function(k){return [k,porCap[k]];}).sort(function(a,b){return b[1]-a[1];});
    var maxC=caps.length?caps[0][1]:1;
    var barras=caps.map(function(x){
      return '<div class="caprow"><span class="capn" title="'+esc(x[0])+'">'+esc(x[0])+'</span>'+
        '<span class="capbar"><span class="capfill" style="width:'+Math.max(3,Math.round(100*x[1]/maxC))+'%"></span></span>'+
        '<span class="capc">'+x[1]+'</span></div>';
    }).join("");
    $("resumen").innerHTML = caps.length ? ('<h2 class="sec">Resumen por capítulo · '+caps.length+' capítulo'+(caps.length>1?"s":"")+' · '+m.length+' partidas</h2><div class="capwrap">'+barras+'</div>') : "";
  }

  // ---- WOW: contadores que animan de 0 al valor (easeOutCubic) ----
  function animarContadores(scope){
    var els=scope.querySelectorAll(".n[data-to]");
    Array.prototype.forEach.call(els,function(el){
      var to=parseFloat(el.getAttribute("data-to"))||0, dec=parseInt(el.getAttribute("data-dec")||"0",10);
      var dur=750, t0=performance.now();
      (function paso(now){
        var p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3), v=to*e;
        el.textContent = v.toLocaleString("pt-PT",{minimumFractionDigits:dec,maximumFractionDigits:dec});
        if(p<1) requestAnimationFrame(paso);
      })(performance.now());
    });
  }

  // ---- WOW: dashboard (anillo de integridad + donut por capítulo) ----
  var PALETA=["#E8590C","#0E7C86","#4472C4","#E0A458","#7B6CA6","#3FA66A","#C0556B","#5B8DEF","#B4A06A","#9AA3AD"];
  function pintarDashboard(m, merged){
    if(!m.length){ $("dash").innerHTML=""; return; }
    var fuente=merged.hojas.filter(function(h){return !h.excluida;});
    var perdida=fuente.filter(function(h){return (h.avisos||[]).some(function(a){return /p[ée]rdida/i.test(a);});}).length;
    var pct = fuente.length ? Math.round(100*(fuente.length-perdida)/fuente.length) : 100, ok=(perdida===0);
    var sub = ok ? ('<b>0 pérdidas</b><br>'+m.length.toLocaleString("pt-PT")+' mediciones recuperadas · '+fuente.length+' hoja'+(fuente.length!==1?"s":"")+'')
                 : ('<b>'+perdida+' hoja'+(perdida>1?"s":"")+' a revisar</b><br>posible pérdida: revisa los avisos antes de usar');
    var ring='<div class="dcard"><div class="dc-chart">'+anilloSVG(pct,ok)+'</div><div><h3>Integridad de la extracción</h3><div class="d-sub">'+sub+'</div></div></div>';

    var porCap={}; m.forEach(function(r){ var k=(r.capitulo&&String(r.capitulo).trim())||"(sin capítulo)"; porCap[k]=(porCap[k]||0)+1; });
    var caps=Object.keys(porCap).map(function(k){return [k,porCap[k]];}).sort(function(a,b){return b[1]-a[1];});
    var top=caps.slice(0,9), resto=caps.slice(9);
    if(resto.length){ top.push(["+ "+resto.length+" capítulos más", resto.reduce(function(a,x){return a+x[1];},0)]); }
    var donut='<div class="dcard"><div class="dc-text"><h3>Distribución por capítulo</h3><div class="donut-leg">'+
      top.map(function(x,i){return '<span class="li"><span class="sw" style="background:'+PALETA[i%PALETA.length]+'"></span><span class="t" title="'+esc(x[0])+'">'+esc(x[0])+'</span><span class="v">'+x[1]+'</span></span>';}).join("")+'</div></div></div>';
    $("dash").innerHTML = ring+donut;
    var rc=$("dash").querySelector("circle[data-off]");   // dispara la animación del trazo
    if(rc) requestAnimationFrame(function(){ rc.setAttribute("stroke-dashoffset", rc.getAttribute("data-off")); });
  }
  function anilloSVG(pct, ok){
    var R=48, C=2*Math.PI*R, off=C*(1-pct/100), col=ok?"#15803D":"#B45309";
    return '<svg width="128" height="128" viewBox="0 0 128 128" style="flex:none">'+
      '<circle cx="64" cy="64" r="'+R+'" fill="none" stroke="#ECEEF1" stroke-width="12"/>'+
      '<circle cx="64" cy="64" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+C.toFixed(1)+'" transform="rotate(-90 64 64)" style="transition:stroke-dashoffset 1s ease" data-off="'+off.toFixed(1)+'"/>'+
      (ok?'<text x="64" y="73" text-anchor="middle" class="ring-n" style="fill:'+col+';font-size:34px">✓</text>'
         :'<text x="64" y="72" text-anchor="middle" class="ring-n">'+pct+'%</text>')+'</svg>';
  }
  function donutSVG(items){
    if(items.length<=1) return '<svg width="128" height="128" viewBox="0 0 128 128" style="flex:none"><circle cx="64" cy="64" r="56" fill="'+PALETA[0]+'"/><circle cx="64" cy="64" r="34" fill="#fff"/></svg>';
    var tot=items.reduce(function(a,x){return a+x[1];},0)||1, ang=-Math.PI/2, cx=64,cy=64,R=56,r=34, paths="";
    items.forEach(function(x,i){
      var frac=x[1]/tot, a2=ang+frac*2*Math.PI, large=frac>0.5?1:0;
      var x1=cx+R*Math.cos(ang), y1=cy+R*Math.sin(ang), x2=cx+R*Math.cos(a2), y2=cy+R*Math.sin(a2);
      var x3=cx+r*Math.cos(a2), y3=cy+r*Math.sin(a2), x4=cx+r*Math.cos(ang), y4=cy+r*Math.sin(ang);
      paths+='<path d="M'+x1.toFixed(2)+' '+y1.toFixed(2)+' A'+R+' '+R+' 0 '+large+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+' L'+x3.toFixed(2)+' '+y3.toFixed(2)+' A'+r+' '+r+' 0 '+large+' 0 '+x4.toFixed(2)+' '+y4.toFixed(2)+' Z" fill="'+PALETA[i%PALETA.length]+'"/>';
      ang=a2;
    });
    return '<svg width="92" height="92" viewBox="0 0 92 92" style="flex:none">'+paths+'</svg>';
  }

  // estilo del Excel: cabecera gris, fuente 10, una línea, zebra, autofiltro y
  // anchos auto-ajustados al contenido con tope por columna.
  function estilar(ws, caps, numCols){
    if(!ws["!ref"]) return;
    var rng=XLSX.utils.decode_range(ws["!ref"]);
    ws["!autofilter"]={ref:ws["!ref"]};
    var gris={patternType:"solid",fgColor:{rgb:"D9D9D9"}}, zeb={patternType:"solid",fgColor:{rgb:"F4F6F8"}}, W=[];
    for(var c=rng.s.c;c<=rng.e.c;c++){
      var mx=4, cap=(caps&&caps[c])||18, hd=ws[XLSX.utils.encode_cell({r:0,c:c})];
      if(hd){ mx=Math.max(mx,String(hd.v).length); hd.s={fill:gris,font:{sz:10,bold:true},alignment:{vertical:"center"}}; }
      for(var r=1;r<=rng.e.r;r++){
        var ad=XLSX.utils.encode_cell({r:r,c:c}), cell=ws[ad]||(ws[ad]={t:"s",v:""});   // celda vacía -> zebra uniforme
        var disp=String(cell.w!=null?cell.w:(cell.v==null?"":cell.v)); if(disp.length>mx) mx=disp.length;
        var st={font:{sz:10},alignment:{vertical:"center",wrapText:false}};
        if(r%2===0) st.fill=zeb;
        if(numCols&&numCols[c]) st.numFmt="#,##0.00";
        cell.s=st;
      }
      W.push({wch:Math.min(mx+2,cap)});
    }
    ws["!cols"]=W;
  }

  // descarga del Excel acumulado
  $("dl").addEventListener("click",function(){
    if(!merged) return;
    var C=merged.CANON;
    var aoa=[C].concat(merged.mediciones.map(function(r){return C.map(function(c){return r[c]===""?null:r[c];});}));
    var ws=XLSX.utils.aoa_to_sheet(aoa);
    estilar(ws, [24,16,9,24,24,22,34,11,50,34,8,13,14,14], {11:1,12:1,13:1});
    var out=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(out,ws,"Mediciones");
    if(merged.notas.length){ var wn=XLSX.utils.json_to_sheet(merged.notas); estilar(wn, [16,9,80], {}); XLSX.utils.book_append_sheet(out,wn,"Notas"); }
    var nombre = cargados.length===1 ? cargados[0].archivo.replace(/\.(xlsx|xls)$/i,"") : "mediciones_acumuladas";
    XLSX.writeFile(out, nombre+"_normalizado.xlsx");
  });

  // descarga del Excel 2 «hoja de costes»: estructura (Código·Nat·Ud·Partida·CanPres)
  // para volcar al sistema de costes de Kalam. Sin precios ni subtotales.
  function estilarCostes(ws){
    if(!ws["!ref"]) return;
    var rng=XLSX.utils.decode_range(ws["!ref"]);
    ws["!autofilter"]={ref:ws["!ref"]};
    var gris={patternType:"solid",fgColor:{rgb:"D9D9D9"}};
    // tonos suaves por tipo de fila (capítulo/subcapítulo/sección)
    var fillNat={Capitulo:"4472C4",Subcapitulo:"B4C6E7",Sección:"D9E1F2",__archivo__:"E8590C"};
    var W=[10,12,6,60,12];
    for(var c=rng.s.c;c<=rng.e.c;c++){
      var hd=ws[XLSX.utils.encode_cell({r:0,c:c})];
      if(hd) hd.s={fill:gris,font:{sz:10,bold:true},alignment:{vertical:"center"}};
      for(var r=1;r<=rng.e.r;r++){
        var ad=XLSX.utils.encode_cell({r:r,c:c}), cell=ws[ad]||(ws[ad]={t:"s",v:""});
        var nat=(ws[XLSX.utils.encode_cell({r:r,c:1})]||{}).v;
        var st={font:{sz:10},alignment:{vertical:"center",wrapText:false}};
        if(c===4) st.numFmt="#,##0.00";
        if(fillNat[nat]){ st.fill={patternType:"solid",fgColor:{rgb:fillNat[nat]}};
          st.font={sz:10,bold:true,color:{rgb:(nat==="Sección"?"15191E":"FFFFFF")}}; }
        cell.s=st;
      }
    }
    ws["!cols"]=W.map(function(w){return {wch:w};});
  }
  $("dlcost").addEventListener("click",function(){
    if(!merged || !merged.estructura || !merged.estructura.length) return;
    var H=merged.COSTHEAD;
    var aoa=[H].concat(merged.estructura.map(function(r){
      if(r.nat==="__archivo__") return ["▼ "+r.partida,"","","",""];   // separador de fichero
      var q=r.cantidad; if(typeof q==="number") q=Math.round(q*10000)/10000;   // limpia ruido de coma flotante
      return [r.codigo||"", r.nat||"", r.ud||"", r.partida||"", (q===""||q==null?null:q)];
    }));
    var ws=XLSX.utils.aoa_to_sheet(aoa);
    estilarCostes(ws);
    var out=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(out,ws,"Hoja de costes");
    var nombre = cargados.length===1 ? cargados[0].archivo.replace(/\.(xlsx|xls)$/i,"") : "estudio_acumulado";
    XLSX.writeFile(out, nombre+"_hoja-de-costes.xlsx");
  });
})();
</script>
